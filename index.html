/* Adaptador de almacenamiento: datos guardados en el navegador del dispositivo (localStorage) */
window.storage = {
  get: async (k) => { const v = localStorage.getItem(k); return v === null ? null : { key: k, value: v }; },
  set: async (k, v) => { localStorage.setItem(k, String(v)); return { key: k, value: String(v) }; }
};
/* Service worker: solo para notificaciones, no guarda caché de la app */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});

/* ─── Utilidades ─── */
const uid = () => Math.random().toString(36).slice(2, 9);
const hoyISO = () => new Date().toISOString().slice(0, 10);
const addDias = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const DIAS = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
const fmtFecha = (iso) => {
  const d = new Date(iso + "T12:00:00");
  const texto = `${DIAS[d.getDay()]} ${d.getDate()} de ${["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"][d.getMonth()]}`;
  return texto.charAt(0).toUpperCase() + texto.slice(1);
};
const diaCerrado = (iso, diasCerrados) => { const d = new Date(iso + "T12:00:00"); return (diasCerrados || []).includes(d.getDay()); };

/* último día hábil anterior a `iso`, saltando los días marcados como cerrados */
const diaHabilAnterior = (iso, diasCerrados) => {
  let ant = addDias(iso, -1);
  let intentos = 0;
  while (diaCerrado(ant, diasCerrados) && intentos < 7) { ant = addDias(ant, -1); intentos++; }
  return ant;
};

const DIAS_CORTO = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];
const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const aMin = (h) => +h.slice(0, 2) * 60 + +h.slice(3, 5);
const aHora = (m) => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
const lunesDe = (iso) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d.toISOString().slice(0, 10); };
/* orden de columnas empezando el lunes, sin los días marcados como cerrados */
const diasAbiertosOrden = (diasCerrados) => [1, 2, 3, 4, 5, 6, 0].filter((d) => !(diasCerrados || []).includes(d));
const horasDe = (apertura, cierre) => {
  const ini = aMin(apertura || "09:00"), fin = aMin(cierre || "20:00");
  const out = [];
  for (let m = ini; m < fin; m += 30) out.push(aHora(m));
  return out;
};

/* base Firebase de Caprichitos precargada: así cualquier dispositivo que abre el
   link arranca sincronizado, sin tener que pegar la URL a mano en Ajustes */
const SYNC_URL_DEFAULT = "https://caprichitos-9fa42-default-rtdb.firebaseio.com/";
/* clave pública del proyecto (no es secreta, identifica el proyecto ante Firebase) */
const FIREBASE_API_KEY = "AIzaSyAT-MKHhZFrY1FFiRRFCIDLoWMSVdv6FEY";

const firebaseLogin = async (email, password) => {
  const res = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${FIREBASE_API_KEY}`, {
    method: "POST", body: JSON.stringify({ email, password, returnSecureToken: true })
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error?.message || "login_failed");
  return { idToken: data.idToken, refreshToken: data.refreshToken, expiraEn: Date.now() + Number(data.expiresIn) * 1000, email: data.email };
};

const firebaseRefrescar = async (refreshToken) => {
  const res = await fetch(`https://securetoken.googleapis.com/v1/token?key=${FIREBASE_API_KEY}`, {
    method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: `grant_type=refresh_token&refresh_token=${encodeURIComponent(refreshToken)}`
  });
  const data = await res.json();
  if (!res.ok) throw new Error("refresh_failed");
  return { idToken: data.id_token, refreshToken: data.refresh_token, expiraEn: Date.now() + Number(data.expires_in) * 1000 };
};

const CONFIG_DEFAULT = {
  nombre: "Caprichitos",
  clave: "",
  claveAdmin: "",

const DATOS_DEFAULT = { clientes: [], turnos: [], esperas: [], config: CONFIG_DEFAULT };

/* al sincronizar, un turno queda "recordado" si cualquiera de los dos dispositivos
   ya envió el WhatsApp, para no perder ese estado al fusionar */
const unirRecordados = (base, otro) => {
  if (!base) return otro;
  if (!otro) return base;
  const previos = new Map((otro.turnos || []).map((t) => [t.id, t]));
  return {
    ...base,
    turnos: (base.turnos || []).map((t) => {
      const prev = previos.get(t.id);
      return prev && prev.recordado && !t.recordado ? { ...t, recordado: true } : t;
    })
  };
};

/* turnos cuyo recordatorio ya se puede enviar (a partir de horaAviso del día hábil anterior) y aún no fueron recordados */
const pendientesDe = (turnos, config, ahora) => {
  const hoy = ahora.toISOString().slice(0, 10);
  const horaAhora = ahora.toTimeString().slice(0, 5);
  return turnos.filter((t) => {
    if (t.recordado || t.cancelado) return false;
    if (t.fecha < hoy) return false;
    const habilAnterior = diaHabilAnterior(t.fecha, config.diasCerrados);
    if (t.fecha === hoy) return true;
    if (habilAnterior < hoy) return true;
    if (habilAnterior === hoy) return horaAhora >= (config.horaAviso || "10:00");
    return false;
  });
};

/* ─── Candado (pantalla de clave) ─── */
function Candado({ onOk, titulo }) {
  const [valor, setValor] = useState("");
  const [error, setError] = useState(false);
  const intentar = async () => {
    const ok = await onOk(valor);

      <div className="card">

            type="password" inputMode="numeric" value={valor} autoFocus

          />
        </div>
        {error && <p style={{ color: "var(--peligro)", fontSize: 13, marginBottom: 12 }}>Clave incorrecta</p>}

}

/* ─── Login con Firebase (protege la sincronización) ─── */
function LoginFirebase({ onOk }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [cargando, setCargando] = useState(false);

  const intentar = async () => {
    if (!email.trim() || !password) return;
    setCargando(true); setError("");
    try {
      const s = await firebaseLogin(email.trim(), password);
      await onOk(s);
    } catch {
      setError("Email o contraseña incorrectos");
    } finally {
      setCargando(false);
    }
  };

  return (
    <div className="candado">
      <div className="card">
        <h2 style={{ marginBottom: 6 }}>Caprichitos</h2>
        <p className="sub" style={{ marginBottom: 18 }}>Iniciá sesión para acceder a la agenda</p>
        <div className="campo">
          <label>Email</label>
          <input type="email" value={email} autoFocus onChange={(e) => setEmail(e.target.value)} />
        </div>
        <div className="campo">
          <label>Contraseña</label>
          <input
            type="password" value={password}
            onChange={(e) => setPassword(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && intentar()}
          />
        </div>
        {error && <p style={{ color: "var(--peligro)", fontSize: 13, marginBottom: 12 }}>{error}</p>}
        <button className="btn acento" style={{ width: "100%" }} disabled={cargando} onClick={intentar}>
          {cargando ? "Entrando…" : "Entrar"}
        </button>
      </div>
    </div>
  );
}

/* ─── App principal ─── */
function App() {
  const [datos, setDatos] = useState(null);
  const [tab, setTab] = useState("agenda");
  const [desbloqueado, setDesbloqueado] = useState(false);
  const [adminOk, setAdminOk] = useState(false);
  const [backupOculto, setBackupOculto] = useState(null);
  const [ahoraTick, setAhoraTick] = useState(Date.now());
  const [conversion, setConversion] = useState(null);
  const [sesion, setSesion] = useState(undefined); // undefined=verificando, null=mostrar login, objeto=logueado
  const datosRef = useRef(null);
  const sesionRef = useRef(null);
  const datosCargadosRef = useRef(false);

  useEffect(() => { sesionRef.current = sesion; }, [sesion]);

  const traerRemoto = async (syncUrl, idToken) => {
    try {
      const url = `${syncUrl.replace(/\/$/, "")}/datos.json${idToken ? `?auth=${idToken}` : ""}`;
      const res = await fetch(url);
      if (!res.ok) return null;
      return await res.json();
    } catch { return null; }
  };

  const guardarSesion = async (s) => {
    sesionRef.current = s;
    setSesion(s);
    await window.storage.set("estetica-auth", s ? JSON.stringify(s) : "");
  };

  /* restaura la sesión de Firebase guardada en este dispositivo (o pide login) */
  useEffect(() => {
    (async () => {
      const guardado = await window.storage.get("estetica-auth");
      if (!guardado || !guardado.value) { setSesion(null); return; }
      try {
        const s = JSON.parse(guardado.value);
        if (s.expiraEn - Date.now() > 5 * 60 * 1000) {
          sesionRef.current = s; setSesion(s);
        } else {
          const nueva = await firebaseRefrescar(s.refreshToken);
          await guardarSesion({ ...nueva, email: s.email });
        }
      } catch { await guardarSesion(null); }
    })();
  }, []);

  /* carga los datos (una sola vez, apenas hay sesión) y los combina con lo que haya en Firebase */
  useEffect(() => {
    if (!sesion || datosCargadosRef.current) return;
    datosCargadosRef.current = true;
    (async () => {
      const guardado = await window.storage.get("estetica-datos");
      let base = guardado ? JSON.parse(guardado.value) : null;
      if (base) base.config = { ...CONFIG_DEFAULT, ...base.config };
      const syncUrl = (base && base.config.syncUrl) || CONFIG_DEFAULT.syncUrl;

      if (syncUrl) {
        const remoto = await traerRemoto(syncUrl, sesion.idToken);
        if (remoto) {
          remoto.config = { ...CONFIG_DEFAULT, ...remoto.config };
          base = !base ? remoto
            : (remoto.mod || 0) > (base.mod || 0) ? unirRecordados(remoto, base)
            : unirRecordados(base, remoto);
        }
      }
      if (!base) base = { ...DATOS_DEFAULT, config: { ...CONFIG_DEFAULT, syncUrl } };

      setDatos(base);
      datosRef.current = base;
      window.storage.set("estetica-datos", JSON.stringify(base));

      const claveOk = await window.storage.get("estetica-clave-ok");
      if (claveOk && claveOk.value === base.config.clave) setDesbloqueado(true);
      if (!base.config.clave) setDesbloqueado(true);
      const bOculto = await window.storage.get("estetica-backup-oculto-hasta");
      if (bOculto) setBackupOculto(bOculto.value);
    })();
  }, [sesion]);

  useEffect(() => {
    const id = setInterval(() => setAhoraTick(Date.now()), 60000);
    return () => clearInterval(id);
  }, []);

  /* renueva el token antes de que venza (dura 1 hora); si falla, hay que loguearse de nuevo */
  useEffect(() => {
    if (!sesion) return;
    const id = setInterval(async () => {
      const actual = sesionRef.current;
      if (!actual || actual.expiraEn - Date.now() > 5 * 60 * 1000) return;
      try {
        const nueva = await firebaseRefrescar(actual.refreshToken);
        await guardarSesion({ ...nueva, email: actual.email });
      } catch { await guardarSesion(null); }
    }, 4 * 60 * 1000);
    return () => clearInterval(id);
  }, [sesion && sesion.refreshToken]);

  /* trae lo último de otros dispositivos cada tanto, sin pisar cambios más nuevos hechos acá */
  useEffect(() => {
    const syncUrl = datos && datos.config.syncUrl;
    if (!syncUrl) return;
    const id = setInterval(async () => {
      const remoto = await traerRemoto(syncUrl, sesionRef.current && sesionRef.current.idToken);
      const actual = datosRef.current;
      if (remoto && actual && (remoto.mod || 0) > (actual.mod || 0)) {
        remoto.config = { ...CONFIG_DEFAULT, ...remoto.config };
        const fusion = unirRecordados(remoto, actual);
        setDatos(fusion);
        datosRef.current = fusion;
        window.storage.set("estetica-datos", JSON.stringify(fusion));
      }
    }, 45000);
    return () => clearInterval(id);
  }, [datos && datos.config.syncUrl]);

  const guardar = (nuevo) => {
    nuevo = { ...nuevo, mod: Date.now() };
    setDatos(nuevo);
    datosRef.current = nuevo;
    window.storage.set("estetica-datos", JSON.stringify(nuevo));
    const token = sesionRef.current && sesionRef.current.idToken;
    if (nuevo.config.syncUrl && token) {
      fetch(`${nuevo.config.syncUrl.replace(/\/$/, "")}/datos.json?auth=${token}`, {
        method: "PUT", body: JSON.stringify(nuevo)
      }).catch(() => {});
    }
  };

  if (sesion === undefined) return <div className="app"><style>{css}</style><div className="vacio">Cargando…</div></div>;

  if (sesion === null) {
    return (
      <div className="app"><style>{css}</style>
        <LoginFirebase onOk={guardarSesion} />
      </div>
    );
  }

  if (!datos) return <div className="app"><style>{css}</style><div className="vacio">Cargando…</div></div>;

  const { clientes, turnos, config } = datos;

  if (config.clave && !desbloqueado) {
    return (
      <div className="app"><style>{css}</style>
        <Candado titulo="Caprichitos" onOk={async (c) => {
          if (c !== config.clave) return false;
          await window.storage.set("estetica-clave-ok", c);
          setDesbloqueado(true);
          return true;
        }} />
      </div>
    );
  }

  const adminAplica = !config.claveAdmin || adminOk;
  const ahoraD = new Date(ahoraTick);
  const pendientes = pendientesDe(turnos, config, ahoraD);
  const clienteDe = (t) => clientes.find((c) => c.id === t.clienteId);

  const mensajeDe = (t) => {
    const c = clienteDe(t);
    const prof = (config.profesionales || []).find((p) => p.id === t.profesionalId);
    const serv = labelDe(t, config.servicios || SERV_DEF);
    return `¡Hola ${c ? c.nombre.split(" ")[0] : ""}! ✨ Te recordamos tu turno en ${config.nombre} el ${fmtFecha(t.fecha)} a las ${t.hora} hs${prof ? ` con ${prof.nombre}` : ""}${serv !== "Sin servicio" ? ` (${serv})` : ""}. Si necesitás cambiarlo, avisanos. ¡Te esperamos!`;
  };

  const enviarWsp = (t) => {
    const c = clienteDe(t);
    if (!c) return;
    const tel = c.telefono.replace(/\D/g, "");
    const nro = tel.startsWith("54") ? tel : "549" + tel;
    window.open(`https://wa.me/${nro}?text=${encodeURIComponent(mensajeDe(t))}`, "_blank");
    guardar({ ...datos, turnos: turnos.map((x) => x.id === t.id ? { ...x, recordado: true } : x) });
  };

  const hoyClave = ahoraD.toISOString().slice(0, 10);
  const mostrarBackup = ahoraD.getDay() === 6 && ahoraD.getHours() >= 19 && backupOculto !== hoyClave;

  const exportarBackup = () => {
    const blob = new Blob([JSON.stringify(datos, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `backup-estetica-${hoyISO()}.json`; a.click();
    URL.revokeObjectURL(url);
  };

  const importarBackup = (file) => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const nuevo = JSON.parse(reader.result);
        nuevo.config = { ...CONFIG_DEFAULT, ...nuevo.config };
        guardar(nuevo);
      } catch { alert("Archivo inválido"); }
    };
    reader.readAsText(file);
  };

  return (
    <div className="app">
      <style>{css}</style>
      <div className="wrap">
        {mostrarBackup && (
          <div className="aviso" style={{ marginTop: 14, display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
            <span>📋 Es sábado — no te olvides de hacer la copia de seguridad semanal.</span>
            <div style={{ display: "flex", gap: 8 }}>
              <button className="btn mini" onClick={() => setTab("ajustes")}>Ir a Ajustes</button>
              <button className="link" onClick={async () => {
                await window.storage.set("estetica-backup-oculto-hasta", hoyClave);
                setBackupOculto(hoyClave);
              }}>Ya la hice</button>
            </div>
          </div>
        )}
        <div className="header">
          <div className="marca">
            {config.logo
              ? <img className="logo" src={config.logo} alt={config.nombre} />
              : <div className="logo" />}
            <div className="sub">Agenda de turnos</div>
          </div>
        </div>
        <div className="tabs">
          <button className={`tab ${tab === "agenda" ? "on" : ""}`} onClick={() => setTab("agenda")}>Agenda</button>
          <button className={`tab ${tab === "clientes" ? "on" : ""}`} onClick={() => setTab("clientes")}>Clientes</button>
          <button className={`tab ${tab === "espera" ? "on" : ""}`} onClick={() => setTab("espera")}>
            Espera {(datos.esperas || []).length > 0 && <span className="n">{datos.esperas.length}</span>}
          </button>
          <button className={`tab ${tab === "recordatorios" ? "on" : ""}`} onClick={() => setTab("recordatorios")}>
            Recordatorios {pendientes.length > 0 && <span className="n">{pendientes.length}</span>}
          </button>
          <button className={`tab ${tab === "ajustes" ? "on" : ""}`} onClick={() => setTab("ajustes")}>Ajustes</button>
        </div>

        {tab === "agenda" && (
          <VistaAgenda
            datos={datos} guardar={guardar} clienteDe={clienteDe} enviarWsp={enviarWsp}
            conversion={conversion}
            onConversionHecha={() => {
              guardar({ ...datosRef.current, esperas: (datosRef.current.esperas || []).filter((e) => e.id !== conversion.id) });
              setConversion(null);
            }}
            onCancelarConversion={() => setConversion(null)}
          />
        )}
        {tab === "clientes" && <VistaClientes datos={datos} guardar={guardar} />}
        {tab === "espera" && (
          <VistaEspera
            datos={datos} guardar={guardar} clienteDe={clienteDe}
            onConvertir={(e) => { setConversion(e); setTab("agenda"); }}
          />
        )}
        {tab === "recordatorios" && (
          <VistaRecordatorios pendientes={pendientes} clienteDe={clienteDe} enviarWsp={enviarWsp} />
        )}
        {tab === "ajustes" && (
          adminAplica
            ? <VistaAjustes datos={datos} guardar={guardar} exportarBackup={exportarBackup} importarBackup={importarBackup}
                cuentaEmail={sesion.email} onCerrarSesion={() => guardarSesion(null)} />
            : <Candado titulo="Ajustes" onOk={async (c) => {
                if (c !== config.claveAdmin) return false;
                setAdminOk(true);
                return true;
              }} />
        )}
      </div>
    </div>
  );
}

/* ─── Vista Agenda: día / semana / mes ─── */
function VistaAgenda({ datos, guardar, clienteDe, enviarWsp, conversion, onConversionHecha, onCancelarConversion }) {
  const { clientes, turnos, config } = datos;
  const servicios = config.servicios || SERV_DEF;
  const profesionales = config.profesionales || [];
  const abiertosOrden = diasAbiertosOrden(config.diasCerrados);
  const horas = horasDe(config.horaApertura, config.horaCierre);

  const [vista, setVista] = useState("dia");
  const [fechaSel, setFechaSel] = useState(hoyISO());
  const [mostrarForm, setMostrarForm] = useState(false);
  const [editId, setEditId] = useState(null);

  const cerrado = (iso) => diaCerrado(iso, config.diasCerrados);
  const turnosDe = (fecha) => turnos.filter((t) => t.fecha === fecha && !t.cancelado).sort((a, b) => a.hora.localeCompare(b.hora));

  useEffect(() => {
    if (conversion) { setVista("dia"); setEditId(null); setMostrarForm(true); }
  }, [conversion]);

  const mover = (dir) => {
    if (vista === "mes") {
      const d = new Date(fechaSel + "T12:00:00");
      d.setDate(1); d.setMonth(d.getMonth() + dir);
      setFechaSel(d.toISOString().slice(0, 10));
    } else if (vista === "semana") {
      setFechaSel(addDias(fechaSel, dir * 7));
    } else {
      let d = addDias(fechaSel, dir), intentos = 0;
      while (cerrado(d) && intentos < 7) { d = addDias(d, dir); intentos++; }
      setFechaSel(d);
    }
  };

  const irADia = (fecha) => { setFechaSel(fecha); setVista("dia"); setMostrarForm(false); setEditId(null); };
  const empezarEdicion = (t) => { setEditId(t.id); setMostrarForm(true); };
  const cerrarForm = () => {
    setMostrarForm(false); setEditId(null);
    if (conversion && onCancelarConversion) onCancelarConversion();
  };

  const guardarTurno = (turno) => {
    let cs = clientes;
    if (turno.clienteNuevo) {
      const nuevoCliente = { id: uid(), nombre: turno.clienteNuevo, telefono: turno.telefonoNuevo || "", provisional: true };
      cs = [...clientes, nuevoCliente];
      turno = { ...turno, clienteId: nuevoCliente.id };
    }
    delete turno.clienteNuevo; delete turno.telefonoNuevo;
    if (editId) {
      const original = turnos.find((t) => t.id === editId);
      const cambioHorario = original.fecha !== turno.fecha || original.hora !== turno.hora;
      guardar({ ...datos, clientes: cs, turnos: turnos.map((t) => t.id === editId ? { ...t, ...turno, recordado: cambioHorario ? false : t.recordado } : t) });
    } else {
      guardar({ ...datos, clientes: cs, turnos: [...turnos, { ...turno, id: uid(), recordado: false }] });
      if (conversion && onConversionHecha) onConversionHecha();
    }
    setMostrarForm(false); setEditId(null);
  };

  const cancelarTurno = () => {
    guardar({ ...datos, turnos: turnos.map((t) => t.id === editId ? { ...t, cancelado: true } : t) });
    cerrarForm();
  };

  const turnoEditando = editId ? turnos.find((t) => t.id === editId) : null;
  const lunes = lunesDe(fechaSel);
  const diasSemana = abiertosOrden.map((dow) => addDias(lunes, (dow + 6) % 7));
  const dSel = new Date(fechaSel + "T12:00:00");

  const titulo = vista === "dia" ? fmtFecha(fechaSel)
    : vista === "semana" ? `Semana del ${new Date(diasSemana[0] + "T12:00:00").getDate()} al ${new Date(diasSemana[diasSemana.length - 1] + "T12:00:00").getDate()} de ${MESES[dSel.getMonth()]}`
    : `${MESES[dSel.getMonth()]} ${dSel.getFullYear()}`;

  const diasEnMes = new Date(dSel.getFullYear(), dSel.getMonth() + 1, 0).getDate();
  const abiertosDelMes = Array.from({ length: diasEnMes }, (_, i) => new Date(dSel.getFullYear(), dSel.getMonth(), i + 1, 12).toISOString().slice(0, 10))
    .filter((d) => !cerrado(d));
  const offsetMes = abiertosDelMes.length ? abiertosOrden.indexOf(new Date(abiertosDelMes[0] + "T12:00:00").getDay()) : 0;
  const celdasMes = [...Array(offsetMes).fill(null), ...abiertosDelMes];
  const gridCols = { gridTemplateColumns: `repeat(${abiertosOrden.length}, 1fr)` };

  return (
    <div>
      <div className="vnav">
        <div className="vsel">
          {[["dia", "Día"], ["semana", "Semana"], ["mes", "Mes"]].map(([k, l]) => (
            <button key={k} className={vista === k ? "on" : ""} onClick={() => setVista(k)}>{l}</button>
          ))}
        </div>
        <div className="nav">
          <button className="navb" onClick={() => mover(-1)}>‹</button>
          <button className="btn fantasma mini" onClick={() => setFechaSel(hoyISO())}>Hoy</button>
          <button className="navb" onClick={() => mover(1)}>›</button>
        </div>
      </div>
      <div className="vtit" style={{ marginBottom: 12 }}>{titulo}</div>

      {vista === "dia" && cerrado(fechaSel) && (
        <div className="card"><div className="vacio">Cerrado este día.</div></div>
      )}

      {vista === "dia" && !cerrado(fechaSel) && (
        <>
          <button className="btn acento" style={{ marginBottom: 16 }} onClick={() => {
            if (mostrarForm) cerrarForm(); else { setMostrarForm(true); setEditId(null); }
          }}>
            {mostrarForm ? "Cerrar" : "+ Nuevo turno"}
          </button>
          {mostrarForm && (
            <FormTurno
              clientes={clientes} profesionales={profesionales} servicios={servicios} horas={horas}
              turno={turnoEditando} inicial={!editId ? conversion : null} fecha={fechaSel}
              onGuardar={guardarTurno} onCancelar={editId ? cancelarTurno : null} onCerrar={cerrarForm}
            />
          )}
          {turnosDe(fechaSel).length === 0 && <div className="vacio">Sin turnos este día.</div>}
          {turnosDe(fechaSel).map((t) => {
            const c = clienteDe(t);
            const prof = profesionales.find((p) => p.id === t.profesionalId);
            return (
              <div className={"turno-item" + (t.id === editId ? " edit" : "")} key={t.id} onClick={() => empezarEdicion(t)}>
                <div className="ti-hora">{t.hora}</div>
                <div className="ti-info">
                  <div className="ti-nombre">{c ? c.nombre : "—"}{t.recordado && <span className="ti-check">✓ recordado</span>}</div>
                  <div className="ti-det">{labelDe(t, servicios)}{prof ? ` · ${prof.nombre}` : ""}</div>
                </div>
                <button className="btn acento mini" disabled={!c || !c.telefono} onClick={(e) => { e.stopPropagation(); enviarWsp(t); }}>WhatsApp</button>
              </div>
            );
          })}
        </>
      )}

      {vista === "semana" && (
        <div className="scrollx">
          <div className="semana" style={gridCols}>
            {diasSemana.map((d, i) => (
              <div key={d} className={"diacol" + (d === hoyISO() ? " hoy" : "")} onClick={() => irADia(d)}>
                <div className="dnum">{DIAS_CORTO[abiertosOrden[i]]} {new Date(d + "T12:00:00").getDate()}</div>
                {turnosDe(d).map((t) => {
                  const c = clienteDe(t);
                  return <div className="tmini" key={t.id}>{t.hora} {c ? c.nombre.split(" ")[0] : "?"}</div>;
                })}
              </div>
            ))}
          </div>
        </div>
      )}

      {vista === "mes" && (
        <div className="mes" style={gridCols}>
          {abiertosOrden.map((d) => <div className="mcab" key={d}>{DIAS_CORTO[d]}</div>)}
          {celdasMes.map((d, i) => d === null
            ? <div className="mcel off" key={"v" + i} />
            : (
              <div key={d} className={"mcel" + (d === hoyISO() ? " hoy" : "")} onClick={() => irADia(d)}>
                <div className="mnum">{new Date(d + "T12:00:00").getDate()}</div>
                {turnosDe(d).length > 0 && <span className="mcnt">{turnosDe(d).length}</span>}
              </div>
            ))}
        </div>
      )}
    </div>
  );
}

function FormTurno({ clientes, profesionales, servicios, horas, turno, inicial, fecha, onGuardar, onCancelar, onCerrar }) {
  const seed = turno || inicial || null;
  const [busqueda, setBusqueda] = useState(seed ? (clientes.find((c) => c.id === seed.clienteId)?.nombre || "") : "");
  const [clienteId, setClienteId] = useState(seed ? (seed.clienteId || "") : "");
  const [telefonoNuevo, setTelefonoNuevo] = useState("");
  const [hora, setHora] = useState(turno ? turno.hora : (horas[0] || "10:00"));
  const [serviciosSel, setServiciosSel] = useState(seed ? (seed.servicios || []) : []);
  const [profesionalId, setProfesionalId] = useState(turno ? (turno.profesionalId || "") : "");

  const clienteElegido = clientes.find((c) => c.id === clienteId);
  const sugerencias = busqueda.length > 0 && !clienteElegido
    ? clientes.filter((c) => c.nombre.toLowerCase().includes(busqueda.toLowerCase())).slice(0, 5)
    : [];

  const toggleServicio = (id) => setServiciosSel((prev) => prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]);
  const duracionTotal = serviciosSel.reduce((a, id) => a + (servicios.find((s) => s.id === id)?.min || 0), 0);

  const guardar = () => {
    if ((!clienteElegido && busqueda.trim() === "") || serviciosSel.length === 0) return;
    onGuardar({
      clienteId: clienteElegido ? clienteElegido.id : undefined,
      clienteNuevo: clienteElegido ? undefined : busqueda.trim(),
      telefonoNuevo,
      fecha, hora, servicios: serviciosSel, profesionalId: profesionalId || undefined
    });
  };

  return (
    <div className="card">
      <div className="campo">
        <label>Cliente</label>
        <input
          value={clienteElegido ? clienteElegido.nombre : busqueda}
          onChange={(e) => { setBusqueda(e.target.value); setClienteId(""); }}
          placeholder="Buscar o escribir nombre nuevo"
        />
        {sugerencias.length > 0 && (
          <div style={{ border: "1px solid var(--linea)", borderRadius: 10, marginTop: 4, overflow: "hidden" }}>
            {sugerencias.map((c) => (
              <div className="sug" key={c.id} onClick={() => { setClienteId(c.id); setBusqueda(c.nombre); }}>
                {c.nombre} <div className="det">{c.telefono}</div>
              </div>
            ))}
          </div>
        )}
      </div>
      {!clienteElegido && busqueda.trim() !== "" && (
        <div className="campo">
          <label>Teléfono (para WhatsApp)</label>
          <input value={telefonoNuevo} onChange={(e) => setTelefonoNuevo(e.target.value)} placeholder="Ej: 1122334455" />
        </div>
      )}
      <div className="campo">
        <label>Hora</label>
        <select value={hora} onChange={(e) => setHora(e.target.value)}>
          {horas.map((h) => <option key={h} value={h}>{h}</option>)}
        </select>
      </div>
      <div className="campo">
        <label>Servicios (tocá para elegir uno o más)</label>
        <div className="servchips">
          {servicios.map((s) => (
            <button key={s.id} type="button" className={"schip" + (serviciosSel.includes(s.id) ? " on" : "")} onClick={() => toggleServicio(s.id)}>
              {s.nombre} · {s.min}′
            </button>
          ))}
        </div>
        {duracionTotal > 0 && <div className="durinfo">Duración total: {duracionTotal} min</div>}
      </div>
      {profesionales.length > 0 && (
        <div className="campo">
          <label>Profesional</label>
          <div className="servchips">
            <button type="button" className={"schip" + (!profesionalId ? " on" : "")} onClick={() => setProfesionalId("")}>Sin asignar</button>
            {profesionales.map((p) => (
              <button key={p.id} type="button" className={"schip" + (profesionalId === p.id ? " on" : "")} onClick={() => setProfesionalId(p.id)}>{p.nombre}</button>
            ))}
          </div>
        </div>
      )}
      <div className="fila" style={{ marginTop: 14 }}>
        <button className="btn acento" style={{ flex: 2 }} onClick={guardar}>{turno ? "Guardar cambios" : "Guardar turno"}</button>
        {onCancelar && <button className="btn peligro" onClick={onCancelar}>Cancelar turno</button>}
        <button className="btn fantasma" onClick={onCerrar}>Cerrar</button>
      </div>
    </div>
  );
}

/* ─── Vista Recordatorios ─── */
function VistaRecordatorios({ pendientes, clienteDe, enviarWsp }) {
  return (
    <div>
      <div className="aviso" style={{ marginBottom: 16 }}>
        Acá aparecen los turnos que ya se pueden recordar. Tocá el botón para abrir WhatsApp con el mensaje listo para enviar.
      </div>
      {pendientes.length === 0 && <div className="vacio">No hay recordatorios pendientes por ahora.</div>}
      {pendientes.map((t) => {
        const c = clienteDe(t);
        return (
          <div className="card" key={t.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
            <div>
              <div style={{ fontWeight: 700, fontSize: 14.5 }}>{c ? c.nombre : "(cliente eliminado)"}</div>
              <div style={{ color: "var(--tinta2)", fontSize: 13, marginTop: 2 }}>
                {fmtFecha(t.fecha)} · {t.hora} hs
                {c && !c.telefono && " · sin teléfono cargado"}
              </div>
            </div>
            <button className="btn acento mini" disabled={!c || !c.telefono} onClick={() => enviarWsp(t)}>Enviar por WhatsApp</button>
          </div>
        );
      })}
    </div>
  );
}

/* ─── Vista Clientes ─── */
function VistaClientes({ datos, guardar }) {
  const { clientes, turnos } = datos;
  const [busqueda, setBusqueda] = useState("");
  const [mostrarForm, setMostrarForm] = useState(false);
  const [editId, setEditId] = useState(null);
  const [nombre, setNombre] = useState("");
  const [telefono, setTelefono] = useState("");
  const [notas, setNotas] = useState("");

  const filtrados = clientes
    .filter((c) => c.nombre.toLowerCase().includes(busqueda.toLowerCase()))
    .sort((a, b) => a.nombre.localeCompare(b.nombre));

  const abrirNuevo = () => { setEditId(null); setNombre(""); setTelefono(""); setNotas(""); setMostrarForm(true); };
  const abrirEdicion = (c) => { setEditId(c.id); setNombre(c.nombre); setTelefono(c.telefono || ""); setNotas(c.notas || ""); setMostrarForm(true); };
  const cerrarForm = () => { setMostrarForm(false); setEditId(null); };

  const guardarCliente = () => {
    if (!nombre.trim()) return;
    if (editId) {
      guardar({ ...datos, clientes: clientes.map((c) => c.id === editId ? { ...c, nombre: nombre.trim(), telefono, notas, provisional: false } : c) });
    } else {
      guardar({ ...datos, clientes: [...clientes, { id: uid(), nombre: nombre.trim(), telefono, notas }] });
    }
    cerrarForm();
  };

  const eliminar = (id) => {
    if (turnos.some((t) => t.clienteId === id && !t.cancelado)) {
      if (!confirm("Este cliente tiene turnos activos. ¿Eliminar de todos modos?")) return;
    }
    guardar({ ...datos, clientes: clientes.filter((c) => c.id !== id) });
    if (editId === id) cerrarForm();
  };

  return (
    <div>
      <div className="campo">
        <input placeholder="Buscar cliente…" value={busqueda} onChange={(e) => setBusqueda(e.target.value)} />
      </div>
      <button className="btn acento" style={{ marginBottom: 16 }} onClick={() => mostrarForm ? cerrarForm() : abrirNuevo()}>
        {mostrarForm ? "Cerrar" : "+ Nuevo cliente"}
      </button>
      {mostrarForm && (
        <div className="card">
          <div className="campo"><label>Nombre</label><input value={nombre} onChange={(e) => setNombre(e.target.value)} /></div>
          <div className="campo"><label>Teléfono</label><input value={telefono} onChange={(e) => setTelefono(e.target.value)} /></div>
          <div className="campo"><label>Notas</label><textarea value={notas} onChange={(e) => setNotas(e.target.value)} rows={2} /></div>
          <div className="fila">
            <button className="btn acento" style={{ flex: 2 }} onClick={guardarCliente}>{editId ? "Guardar cambios" : "Guardar cliente"}</button>
            {editId && <button className="btn peligro" onClick={() => eliminar(editId)}>Eliminar</button>}
          </div>
        </div>
      )}
      {filtrados.length === 0 && <div className="vacio">No hay clientes.</div>}
      <div className="lista-cli">
        {filtrados.map((c) => (
          <div className="cli-item" key={c.id} onClick={() => abrirEdicion(c)}>
            <div>
              <div className="nombre">{c.nombre}</div>
              <div className="det">{c.telefono || "sin teléfono"}{c.notas ? ` · ${c.notas}` : ""}</div>
            </div>
            <button className="link" onClick={(e) => { e.stopPropagation(); eliminar(c.id); }}>Eliminar</button>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ─── Vista Lista de espera ─── */
function VistaEspera({ datos, guardar, clienteDe, onConvertir }) {
  const { clientes } = datos;
  const esperas = datos.esperas || [];
  const servicios = datos.config.servicios || SERV_DEF;
  const [mostrarForm, setMostrarForm] = useState(false);
  const [busqueda, setBusqueda] = useState("");
  const [clienteId, setClienteId] = useState("");
  const [telefonoNuevo, setTelefonoNuevo] = useState("");
  const [serviciosSel, setServiciosSel] = useState([]);
  const [notas, setNotas] = useState("");

  const clienteElegido = clientes.find((c) => c.id === clienteId);
  const sugerencias = busqueda.length > 0 && !clienteElegido
    ? clientes.filter((c) => c.nombre.toLowerCase().includes(busqueda.toLowerCase())).slice(0, 5)
    : [];
  const toggleServicio = (id) => setServiciosSel((prev) => prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]);

  const limpiarForm = () => { setBusqueda(""); setClienteId(""); setTelefonoNuevo(""); setServiciosSel([]); setNotas(""); };

  const agregar = () => {
    if (!clienteElegido && busqueda.trim() === "") return;
    let cs = clientes;
    let clienteFinalId = clienteElegido ? clienteElegido.id : null;
    if (!clienteElegido) {
      const nuevoCliente = { id: uid(), nombre: busqueda.trim(), telefono: telefonoNuevo || "", provisional: true };
      cs = [...clientes, nuevoCliente];
      clienteFinalId = nuevoCliente.id;
    }
    const nuevaEspera = { id: uid(), clienteId: clienteFinalId, servicios: serviciosSel, notas: notas.trim(), fecha: hoyISO() };
    guardar({ ...datos, clientes: cs, esperas: [...esperas, nuevaEspera] });
    limpiarForm();
    setMostrarForm(false);
  };

  const quitar = (id) => guardar({ ...datos, esperas: esperas.filter((e) => e.id !== id) });

  return (
    <div>
      <button className="btn acento" style={{ marginBottom: 16 }} onClick={() => { setMostrarForm(!mostrarForm); limpiarForm(); }}>
        {mostrarForm ? "Cerrar" : "+ Agregar a la lista"}
      </button>
      {mostrarForm && (
        <div className="card">
          <div className="campo">
            <label>Cliente</label>
            <input
              value={clienteElegido ? clienteElegido.nombre : busqueda}
              onChange={(e) => { setBusqueda(e.target.value); setClienteId(""); }}
              placeholder="Buscar o escribir nombre nuevo"
            />
            {sugerencias.length > 0 && (
              <div style={{ border: "1px solid var(--linea)", borderRadius: 10, marginTop: 4, overflow: "hidden" }}>
                {sugerencias.map((c) => (
                  <div className="sug" key={c.id} onClick={() => { setClienteId(c.id); setBusqueda(c.nombre); }}>
                    {c.nombre} <div className="det">{c.telefono}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
          {!clienteElegido && busqueda.trim() !== "" && (
            <div className="campo">
              <label>Teléfono (para WhatsApp)</label>
              <input value={telefonoNuevo} onChange={(e) => setTelefonoNuevo(e.target.value)} placeholder="Ej: 1122334455" />
            </div>
          )}
          <div className="campo">
            <label>Servicios que quiere (opcional)</label>
            <div className="servchips">
              {servicios.map((s) => (
                <button key={s.id} type="button" className={"schip" + (serviciosSel.includes(s.id) ? " on" : "")} onClick={() => toggleServicio(s.id)}>
                  {s.nombre}
                </button>
              ))}
            </div>
          </div>
          <div className="campo">
            <label>Notas</label>
            <textarea value={notas} onChange={(e) => setNotas(e.target.value)} rows={2} placeholder="Ej: prefiere sábados a la tarde" />
          </div>
          <button className="btn acento" style={{ width: "100%" }} onClick={agregar}>Agregar a la lista</button>
        </div>
      )}
      {esperas.length === 0 && <div className="vacio">No hay nadie en la lista de espera.</div>}
      {esperas.map((e) => {
        const c = clienteDe(e);
        return (
          <div className="espera-item" key={e.id}>
            <div className="ei-nombre">{c ? c.nombre : "(cliente eliminado)"}</div>
            <div className="ei-det">
              {e.servicios && e.servicios.length > 0 ? labelDe(e, servicios) : "Sin servicio especificado"}
              {e.notas ? ` · ${e.notas}` : ""}
            </div>
            <div className="ei-acciones">
              <button className="btn mini acento" onClick={() => onConvertir(e)}>Convertir en turno</button>
              <button className="btn mini fantasma" onClick={() => quitar(e.id)}>Quitar</button>
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ─── Vista Ajustes ─── */
function VistaAjustes({ datos, guardar, exportarBackup, importarBackup, cuentaEmail, onCerrarSesion }) {
  const { config } = datos;
  const [form, setForm] = useState(config);
  const [nuevoProf, setNuevoProf] = useState("");
  const [nuevoServ, setNuevoServ] = useState({ nombre: "", min: 30 });
  const fileRef = useRef();

  const set = (campo, valor) => setForm({ ...form, [campo]: valor });
  const aplicar = () => guardar({ ...datos, config: form });

  const toggleDia = (n) => {
    const set2 = new Set(form.diasCerrados || []);
    set2.has(n) ? set2.delete(n) : set2.add(n);
    setForm({ ...form, diasCerrados: [...set2] });
  };

  const agregarProf = () => {
    if (!nuevoProf.trim()) return;
    setForm({ ...form, profesionales: [...(form.profesionales || []), { id: uid(), nombre: nuevoProf.trim() }] });
    setNuevoProf("");
  };

  const agregarServ = () => {
    if (!nuevoServ.nombre.trim()) return;
    setForm({ ...form, servicios: [...(form.servicios || []), { id: uid(), nombre: nuevoServ.nombre.trim(), min: +nuevoServ.min || 30 }] });
    setNuevoServ({ nombre: "", min: 30 });
  };

  const cargarLogo = (file) => {
    const reader = new FileReader();
    reader.onload = () => set("logo", reader.result);
    reader.readAsDataURL(file);
  };

  return (
    <div>
      <div className="card" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
        <div>
          <h3 style={{ marginBottom: 4 }}>Cuenta</h3>
          <div className="sub">Conectado como {cuentaEmail}</div>
        </div>
        <button className="link" onClick={onCerrarSesion}>Cerrar sesión</button>
      </div>

      <div className="card">
        <h3 style={{ marginBottom: 14 }}>Negocio</h3>
        <div className="campo"><label>Nombre</label><input value={form.nombre} onChange={(e) => set("nombre", e.target.value)} /></div>
        <div className="campo">
          <label>Logo</label>
          <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
            {form.logo && <img src={form.logo} alt="logo" style={{ width: 56, height: 56, borderRadius: "50%", objectFit: "cover" }} />}
            <input type="file" accept="image/*" onChange={(e) => e.target.files[0] && cargarLogo(e.target.files[0])} />
          </div>
        </div>
      </div>

      <div className="card">
        <h3 style={{ marginBottom: 14 }}>Profesionales</h3>
        {(form.profesionales || []).map((p) => (
          <div className="profesional-chip" key={p.id}>
            {p.nombre}
            <button className="link" onClick={() => set("profesionales", form.profesionales.filter((x) => x.id !== p.id))}>Quitar</button>
          </div>
        ))}
        <div className="fila" style={{ marginTop: 10 }}>
          <input value={nuevoProf} onChange={(e) => setNuevoProf(e.target.value)} placeholder="Nombre" />
          <button className="btn mini" onClick={agregarProf}>Agregar</button>
        </div>
      </div>

      <div className="card">
        <h3 style={{ marginBottom: 14 }}>Servicios</h3>
        {(form.servicios || []).map((s) => (
          <div className="profesional-chip" key={s.id}>
            {s.nombre} · {s.min}′
            <button className="link" onClick={() => set("servicios", form.servicios.filter((x) => x.id !== s.id))}>Quitar</button>
          </div>
        ))}
        <div className="fila" style={{ marginTop: 10 }}>
          <input value={nuevoServ.nombre} onChange={(e) => setNuevoServ({ ...nuevoServ, nombre: e.target.value })} placeholder="Nombre del servicio" />
          <input type="number" min="5" step="5" value={nuevoServ.min} style={{ flex: "0 0 70px" }}
            onChange={(e) => setNuevoServ({ ...nuevoServ, min: e.target.value })} placeholder="Min" />
          <button className="btn mini" style={{ flex: "0 0 auto" }} onClick={agregarServ}>Agregar</button>
        </div>
      </div>

      <div className="card">
        <h3 style={{ marginBottom: 14 }}>Horario de atención</h3>
        <div className="fila">
          <div className="campo"><label>Apertura</label><input type="time" value={form.horaApertura} onChange={(e) => set("horaApertura", e.target.value)} /></div>
          <div className="campo"><label>Cierre</label><input type="time" value={form.horaCierre} onChange={(e) => set("horaCierre", e.target.value)} /></div>
        </div>
      </div>

      <div className="card">
        <h3 style={{ marginBottom: 14 }}>Días cerrados y recordatorios</h3>
        <div className="campo">
          <label>Días sin atención</label>
          <div className="fila" style={{ flexWrap: "wrap", gap: 6 }}>
            {DIAS.map((d, i) => (
              <button key={i} className={`btn mini ${(form.diasCerrados || []).includes(i) ? "" : "fantasma"}`} onClick={() => toggleDia(i)}>
                {d.slice(0, 3)}
              </button>
            ))}
          </div>
        </div>
        <div className="campo">
          <label>Hora de aviso (día hábil anterior al turno)</label>
          <input type="time" value={form.horaAviso} onChange={(e) => set("horaAviso", e.target.value)} />
        </div>
      </div>

      <div className="card">
        <h3 style={{ marginBottom: 14 }}>Seguridad</h3>
        <div className="campo"><label>Clave de acceso general</label><input value={form.clave} onChange={(e) => set("clave", e.target.value)} placeholder="Dejar vacío para no pedir clave" /></div>
        <div className="campo"><label>Clave de administración (para Ajustes)</label><input value={form.claveAdmin} onChange={(e) => set("claveAdmin", e.target.value)} placeholder="Dejar vacío para no proteger Ajustes" /></div>
      </div>

      <div className="card">
        <h3 style={{ marginBottom: 6 }}>Sincronización entre dispositivos</h3>
        <p className="sub" style={{ marginBottom: 14 }}>Opcional. Pegá la URL de una base Firebase Realtime Database para compartir la agenda entre varios celulares.</p>
        <div className="campo"><input value={form.syncUrl} onChange={(e) => set("syncUrl", e.target.value)} placeholder="https://tu-proyecto-default-rtdb.firebaseio.com/" /></div>
      </div>

      <button className="btn acento" style={{ width: "100%", marginBottom: 14 }} onClick={aplicar}>Guardar ajustes</button>

      <div className="card">
        <h3 style={{ marginBottom: 14 }}>Copia de seguridad</h3>
        <div className="fila">
          <button className="btn fantasma" onClick={exportarBackup}>Exportar backup</button>
          <button className="btn fantasma" onClick={() => fileRef.current.click()}>Importar backup</button>
          <input ref={fileRef} type="file" accept="application/json" style={{ display: "none" }}
            onChange={(e) => e.target.files[0] && importarBackup(e.target.files[0])} />
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
